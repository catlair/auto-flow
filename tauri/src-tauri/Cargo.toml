[package]
name = "autoflow-tauri"
version = "0.2.0"
description = "Auto Flow Tauri 前端外壳"
authors = ["catlair"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "autoflow_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` 是**非默认** feature：不加它 `tauri::tray` 整个模块编译期就不存在
# （报 "could not find `tray` in `tauri`"），而不是运行期报错。
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
